<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">⚡ Super Download Manager</div>
      <label class="switch" title="Enable / disable capturing">
        <input type="checkbox" id="toggle" checked />
        <span class="track"></span>
      </label>
    </header>

    <div id="status">
      <span id="dot"></span>
      <span id="msg">Checking…</span>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
