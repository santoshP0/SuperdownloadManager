name: Release

# Trigger: git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Step 1: create a draft release ──────────────────────────────────────────
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create draft release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref_name;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              tag_name:   tag,
              name:       `SuperDownloadManager ${tag}`,
              body: `## SuperDownloadManager ${tag}

            ### Windows
            | File | Description |
            |------|-------------|
            | \`SuperDownloadManager_x64-setup.exe\` | **Recommended** — NSIS one-click installer |
            | \`SuperDownloadManager_x64_en-US.msi\`  | Windows Installer (MSI) |

            > Windows may show a SmartScreen warning on first run (unsigned build).
            > Click **More info → Run anyway** to proceed.

            ### macOS
            | File | Description |
            |------|-------------|
            | \`SuperDownloadManager_universal.dmg\` | Universal binary — runs on both Intel and Apple Silicon |

            > macOS may show "unidentified developer" on first run (unsigned build).
            > Right-click → **Open** → **Open** to proceed.

            ### What's new
            See the [commit history](https://github.com/${{ github.repository }}/commits/${tag})`,
              draft:      true,
              prerelease: false,
            });
            return data.id;

  # ── Step 2a: build Windows ───────────────────────────────────────────────────
  build-windows:
    name: Build Windows installer
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}

  # ── Step 2b: build macOS (universal — Intel + Apple Silicon) ─────────────────
  build-macos:
    name: Build macOS app (universal)
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: --target universal-apple-darwin

  # ── Step 3: publish once both builds succeed ─────────────────────────────────
  publish-release:
    name: Publish release
    needs: [create-release, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner:      context.repo.owner,
              repo:       context.repo.repo,
              release_id: process.env.RELEASE_ID,
              draft:      false,
            });
